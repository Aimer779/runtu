<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>润图 SoftShot</title>
  <style>
    :root {
      --bg: #F5F3EE;
      --bg-deep: #E8E5DE;
      --surface: #FDFBF7;
      --surface-2: #FFFFFF;
      --ink: #2C261E;
      --ink-soft: #5C534A;
      --ink-faint: #746B60;
      --line: #E6E1D8;
      --line-strong: #C8BEB1;
      --accent: #9A4E32;
      --accent-hover: #7F4029;
      --accent-soft: #F6EDE9;
      --accent-ring: #C46B4A;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-display: "Georgia", "Songti SC", "SimSun", serif;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --space-section: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-ui);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; transition: transform 120ms var(--ease); }
    button:active:not(:disabled):not(:focus-visible) { transform: scale(0.96); }
    button:focus-visible,
    input:focus-visible,
    summary:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent-ring);
      outline-offset: 2px;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      display: grid;
      place-items: center;
      color: var(--surface);
    }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
    }
    .brand small {
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    .top-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
    }
    @media (hover: hover) { .btn:hover { background: #fff; border-color: #C9B9A6; } }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #FAF6F1;
    }
    @media (hover: hover) { .btn-primary:hover { background: var(--accent-hover); border-color: transparent; } }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-soft);
    }
    @media (hover: hover) { .btn-ghost:hover { background: rgba(44, 38, 30, 0.05); } }

    .shell {
      flex: 1;
      display: grid;
      grid-template-columns: 332px minmax(0, 1fr);
      gap: 0;
      padding: 0;
      min-height: 0;
    }

    .panel {
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 24px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .section { padding-bottom: var(--space-section); margin-bottom: var(--space-section); border-bottom: 1px solid var(--line); }
    .section:last-child { padding-bottom: 0; margin-bottom: 0; border: 0; }
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    .swatch {
      aspect-ratio: 1;
      border: 0;
      border-radius: var(--radius-sm);
      box-shadow: inset 0 0 0 1px rgba(44, 38, 30, 0.08);
      position: relative;
    }
    .swatch[aria-pressed="true"] {
      box-shadow:
        inset 0 0 0 1px rgba(44, 38, 30, 0.08),
        0 0 0 2px var(--surface),
        0 0 0 4px var(--accent);
    }
    .swatch.is-clear {
      background:
        linear-gradient(45deg, #E8DFD4 25%, transparent 25%),
        linear-gradient(-45deg, #E8DFD4 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #E8DFD4 75%),
        linear-gradient(-45deg, transparent 75%, #E8DFD4 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
      background-color: #F7F1E8;
    }
    .swatch.is-special {
      display: grid;
      place-items: center;
      background: #F3EBE1;
      color: var(--ink-soft);
    }
    .swatch.is-special svg { display: block; }
    .swatch.has-thumb {
      background-size: cover;
      background-position: center;
    }

    .bg-extra { margin-top: 8px; }
    .image-backgrounds {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .image-background {
      overflow: hidden;
      padding: 3px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: left;
    }
    .image-background img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: var(--radius-xs);
      outline: 1px solid rgba(44,38,30,0.12);
      outline-offset: -1px;
    }
    .image-background span { display: block; padding: 6px 0 3px; font-size: 11px; text-align: center; }
    @media (hover: hover) { .image-background:hover { border-color: var(--accent); } }
    .image-background[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent);
      color: var(--accent);
    }
    .image-background:disabled { opacity: 0.5; cursor: wait; }
    .bg-extra[hidden] { display: none !important; }
    #bgFileRow[hidden] { display: none; }
    .linkish {
      min-height: 40px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
    }
    @media (hover: hover) { .linkish:hover { text-decoration: underline; } }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }
    .row label { font-size: 13px; color: var(--ink-soft); }
    .row .value {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-faint);
      min-width: 36px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 40px;
      background: transparent;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--line-strong); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -7px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      box-shadow: 0 1px 3px rgba(44, 38, 30, 0.16);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-track { height: 4px; background: var(--line-strong); }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 50%; }

    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      min-height: 40px;
      min-width: 40px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-2);
      font-size: 12px;
      color: var(--ink-soft);
    }
    .pill[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }
    .toggle-row span { font-size: 13px; color: var(--ink-soft); }
    .switch {
      width: 44px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 0;
      background: transparent;
      position: relative;
    }
    .switch::before { content: ""; position: absolute; inset: 9px 3px; background: var(--line-strong); border-radius: 99px; }
    .switch::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #FFFCF8;
      box-shadow: 0 1px 2px rgba(44, 38, 30, 0.2);
    }
    .switch[aria-pressed="true"]::before { background: var(--accent); }
    .switch[aria-pressed="true"]::after { transform: translateX(16px); }

    .color-row {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .color-row[hidden] { display: none !important; }
    input[type="color"] {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      background: none;
      overflow: hidden;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.8;
      color: var(--ink-faint);
    }

    .looks { display: flex; flex-wrap: wrap; gap: 6px; }
    .save-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-top: 8px;
    }
    .save-row input {
      height: 40px;
      min-width: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      padding: 0 10px;
      font-size: 12px;
    }
    .saved-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .saved-item {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 40px;
      padding: 0 4px 0 10px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12px;
    }
    .saved-item .apply {
      flex: 1;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      min-height: 40px;
      min-width: 0;
      overflow-wrap: anywhere;
      padding: 0;
    }
    .saved-item .del {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      border-radius: 6px;
    }
    @media (hover: hover) { .saved-item .del:hover { background: var(--accent-soft); color: var(--accent); } }
    .saved-item .star {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      border-radius: 6px;
      font-size: 13px;
      line-height: 1;
    }
    @media (hover: hover) { .saved-item .star:hover { background: var(--accent-soft); color: var(--accent); } }
    .saved-item .star.is-on { color: var(--accent); }
    .boot-row { margin-top: 8px; }
    .boot-row .btn { width: 100%; min-height: 40px; padding: 8px; font-size: 12px; white-space: normal; overflow-wrap: anywhere; }
    .boot-on { color: var(--accent); }

    .stage-wrap {
      min-width: 0;
      min-height: 0;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr) 48px;
      padding: 0 28px;
    }

    .stage {
      position: relative;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: var(--bg-deep);
      border-radius: var(--radius-md);
    }

    .drop {
      width: min(440px, 100%);
      text-align: left;
      padding: 32px;
      border-radius: var(--radius-md);
      border: 1px dashed #B6AA99;
      background: var(--surface);
    }
    .drop-icon {
      width: 44px;
      height: 44px;
      margin: 0 0 24px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      color: var(--accent);
    }
    .drop h2 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .drop p { color: var(--ink-soft); font-size: 13px; line-height: 1.8; }
    .drop kbd {
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #D9CBBA;
      background: #FFFCF8;
      color: var(--ink);
    }
    .file-btn {
      margin-top: 18px;
      height: 40px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--surface);
      font-size: 13px;
    }
    @media (hover: hover) { .file-btn:hover { background: var(--accent-hover); } }

    canvas#preview {
      max-width: 100%;
      max-height: 100%;
      display: none;
      touch-action: none;
    }
    .has-image canvas#preview { display: block; }
    canvas#preview.is-nudge { cursor: grab; }
    canvas#preview.is-nudge:active { cursor: grabbing; }
    .has-image .drop { display: none; }

    .stage-wrap.dragover::after {
      content: "放开即可放入";
      position: absolute;
      inset: 12px;
      border-radius: 12px;
      border: 1.5px dashed var(--accent);
      background: rgba(250, 246, 241, 0.72);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--accent);
      pointer-events: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: #FAF6F1;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      max-width: calc(100% - 32px);
      line-height: 1.7;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .brand-copy { display: flex; align-items: baseline; gap: 8px; }
    .brand small { letter-spacing: 0.02em; }
    .local-note { font-size: 12px; color: var(--ink-faint); margin-right: 16px; }
    .local-note::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: #627B59; }
    .btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 7px; }
    .panel-heading { margin-bottom: 24px; }
    .panel-heading h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    .panel-heading p { font-size: 12px; color: var(--ink-faint); line-height: 1.8; }
    .section-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .section-label output { font-size: 12px; font-weight: 400; color: var(--accent-hover); }
    .save-details { margin-top: 10px; }
    .save-details summary { cursor: pointer; min-height: 40px; padding: 10px 0; font-size: 12px; color: var(--ink-soft); }
    .save-details summary:active:not(:focus-visible) { transform: scale(0.98); }
    .background-label { font-size: 12px; color: var(--ink-faint); margin: 16px 0 8px; }
    .workspace-bar, .workspace-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink-faint); }
    .workspace-bar h2 { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
    .workspace-footer output { font-variant-numeric: tabular-nums; }
    .workspace-footer kbd { font: inherit; color: var(--ink-soft); }
    .skip-link { position: fixed; top: -80px; left: 12px; z-index: 30; padding: 12px; background: var(--surface); color: var(--accent); }
    .skip-link:focus { top: 8px; }
    .swatch[aria-pressed="true"]::after { content: "✓"; display: grid; place-items: center; position: absolute; inset: 50% auto auto 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 12px; }
    .image-background { position: relative; }
    .image-background[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--surface); text-align: center; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      button:active:not(:disabled):not(:focus-visible), .save-details summary:active:not(:focus-visible) { transform: none; }
    }
    @media (max-width: 1040px) {
      .local-note { display: none; }
      .stage-wrap { padding: 0 20px; }
      .stage { padding: 20px; }
      .workspace-shortcuts { display: none; }
    }
    @media (max-width: 760px) {
      html, body { height: auto; min-height: 100%; }
      body { overflow: auto; }
      .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
      .top-actions { gap: 6px; }
      .brand small { display: none; }
      .brand h1 { font-size: 21px; }
      .brand .mark { width: 28px; height: 28px; }
      .shell { display: flex; flex-direction: column; }
      .stage-wrap { order: -1; height: clamp(350px, 58svh, 560px); min-height: 350px; padding: 0 16px; grid-template-rows: 44px minmax(0, 1fr) 40px; }
      .stage { padding: 16px; }
      .panel { overflow: visible; border: 0; border-top: 1px solid var(--line); padding: 24px 20px max(28px, env(safe-area-inset-bottom)); }
      .swatches { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .swatch { max-height: 56px; aspect-ratio: auto; height: 44px; }
      .image-backgrounds { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .drop { padding: 20px; }
      .drop-icon { display: none; }
      .drop h2 { font-size: 24px; }
      .drop p { font-size: 12px; }
      .file-btn { margin-top: 14px; }
      .workspace-footer { font-size: 11px; }
    }
    @media (max-width: 480px) {
      .topbar { gap: 10px; }
      .top-actions { width: 100%; }
      .top-actions .btn { padding: 0 12px; }
      .top-actions .btn-primary { margin-left: auto; }
      .brand-copy { align-items: baseline; }
      .brand small { display: inline; font-size: 11px; }
      .local-note { display: none; }
      .swatches { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#stageWrap">跳到图片预览</a>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 15l5-5 5 5 3-3 3 3" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/></svg></span>
      <div class="brand-copy"><h1>润图</h1><small lang="en">SoftShot</small></div>
    </div>
    <div class="top-actions">
      <span class="local-note">本地处理，图片不上传</span>
      <button class="btn btn-ghost" id="btnReset" disabled>换一张</button>
      <button class="btn" id="btnCopy" disabled>复制</button>
      <button class="btn btn-primary" id="btnSave" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>下载 PNG</button>
    </div>
  </header>

  <main class="shell">
    <aside class="panel" aria-label="美化参数">
      <div class="panel-heading"><h2>样式与构图</h2><p>从一组搭配开始，再调成你的样子。</p></div>
      <section class="section">
        <div class="section-label">快捷搭配</div>
        <div class="looks" id="looks"></div>
        <details class="save-details">
          <summary>保存与管理搭配</summary>
        <div class="save-row">
          <input id="lookName" maxlength="16" aria-label="搭配名称" placeholder="给当前搭配起名" />
          <button class="btn" id="btnSaveLook" type="button">保存</button>
        </div>
        <div class="saved-list" id="savedLooks"></div>
        <div class="boot-row">
          <button class="btn" id="btnDefault" type="button">下次打开使用当前搭配</button>
        </div>
        </details>
      </section>

      <section class="section">
        <div class="section-label">背景<output id="backgroundName">暮霭</output></div>
        <div class="swatches" id="swatches"></div>
        <div class="background-label" id="imageBackgroundsLabel">图片背景 · 7 款</div>
        <div class="image-backgrounds" id="imageBackgrounds" role="group" aria-labelledby="imageBackgroundsLabel"></div>
        <div class="color-row" id="solidRow" hidden>
          <input type="color" id="solidColor" value="#C17F65" aria-label="自定义纯色" />

        <input type="range" id="radius" min="0" max="48" value="16" />

        <input type="range" id="shadow" min="0" max="80" value="40" />

      <section class="section">
        <div class="section-label">导出倍率</div>
        <div class="pills" id="scales"></div>
        <p class="hint">PNG 保留透明背景。图片仅在本机处理。<br />固定画布比例后，可拖动截图微调位置。</p>
      </section>
    </aside>

    <section class="stage-wrap" id="stageWrap" aria-label="图片预览" tabindex="-1">
      <div class="workspace-bar"><h2>预览</h2><span id="previewStatus">等待导入图片</span></div>
      <div class="stage" id="stage">
        <div class="drop" id="drop">
          <div class="drop-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 14.5l2.4-2.8a1 1 0 011.5 0L15 15l1.2-1.3a1 1 0 011.5.1L20 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="8.5" cy="9.2" r="1.1" fill="currentColor"/>
            </svg>
          </div>
          <h2>给截图一个好背景</h2>
          <p>把图片拖到这里，或按 <kbd>Ctrl / ⌘</kbd> + <kbd>V</kbd> 粘贴。调整背景、留白与光影，再导出你的作品。</p>
          <button class="file-btn" id="btnPick">选择图片</button>
        </div>
        <canvas id="preview" aria-label="美化后的图片预览"></canvas>
      </div>
      <div class="workspace-footer"><output id="exportInfo">准备好后，导出为 PNG</output><span class="workspace-shortcuts"><kbd>Ctrl / ⌘ + C</kbd> 复制 · <kbd>Ctrl / ⌘ + S</kbd> 下载</span></div>
    </section>
  </main>

  <input type="file" id="file" accept="image/*" hidden />
  <input type="file" id="bgFile" accept="image/*" hidden />
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/backgrounds.js"></script>
  <script>
    const PRESETS = [
      { id: "haze", name: "暮霭", type: "mesh", base: "#E9D8CC",
        orbs: [
          { x: 0.18, y: 0.22, color: "#E8C4B0", s: 0.62, a: 0.80 },
          { x: 0.82, y: 0.18, color: "#C9B3C8", s: 0.58, a: 0.70 },
          { x: 0.55, y: 0.82, color: "#D7C4B0", s: 0.70, a: 0.55 }
        ]},
      { id: "studio", name: "工作室", type: "mesh", base: "#DDD5CB",
        orbs: [
          { x: 0.22, y: 0.30, color: "#E2CDB8", s: 0.60, a: 0.75 },
          { x: 0.78, y: 0.28, color: "#B7C0C8", s: 0.55, a: 0.62 },
          { x: 0.50, y: 0.88, color: "#C9B8A8", s: 0.64, a: 0.50 }
        ]},
      { id: "xuan", name: "宣纸", type: "linear", angle: 165, colors: ["#F6F0E8", "#E8DCCB", "#D4C2AA"] },
      { id: "celadon", name: "青瓷", type: "linear", angle: 150, colors: ["#E4EDE6", "#C5D4C8", "#8FA89A"] },
      { id: "seafog", name: "海雾", type: "linear", angle: 160, colors: ["#E4EBF0", "#C5D0D8", "#8A9AAA"] },
      { id: "champagne", name: "香槟", type: "linear", angle: 140, colors: ["#F3E6D4", "#E0C4A4", "#C9A07A"] },
      { id: "lilac", name: "雪青", type: "linear", angle: 155, colors: ["#EEEAF4", "#D4CEE4", "#B0A8C4"] },
      { id: "dusk", name: "晚霞", type: "linear", angle: 145, colors: ["#F0D4C8", "#D4A8B0", "#8E6E86"] },
      { id: "night", name: "夜蓝", type: "radial", colors: ["#3A465C", "#141820"] },
      { id: "inkstone", name: "砚", type: "radial", colors: ["#3A342E", "#161310"] },
      { id: "slate", name: "青灰", type: "linear", angle: 180, colors: ["#E8EAED", "#C5CAD1", "#9AA3AD"] },
      { id: "matcha", name: "抹茶", type: "linear", angle: 152, colors: ["#E7EDE3", "#C5D0B8", "#8A9A7A"] },
      { id: "solid", name: "纯色", type: "solid" },
      { id: "clear", name: "透明", type: "clear" },
      { id: "photo", name: "配图", type: "photo" },
      { id: "frost", name: "霜化", type: "frost" },
      ...SOFTSHOT_BACKGROUNDS.map((p) => ({ ...p, type: "builtin-image" }))
    ];
    const RATIOS = [
      { id: "auto", label: "自适应" },
      { id: "1:1",  label: "1:1" },
      { id: "16:9", label: "16:9" },
      { id: "4:3",  label: "4:3" },
      { id: "3:2",  label: "3:2" }
    ];
    const LOOKS = [
      { id: "clean", name: "默认", bg: "haze", padding: 72, inset: 0, radius: 16, shadow: 40, opacity: 26, ratio: "auto", chrome: false, noise: true },
      { id: "doc", name: "文档", bg: "xuan", padding: 56, inset: 0, radius: 12, shadow: 24, opacity: 16, ratio: "auto", chrome: false, noise: true },
      { id: "social", name: "社交", bg: "studio", padding: 80, inset: 32, radius: 20, shadow: 48, opacity: 28, ratio: "16:9", chrome: false, noise: true },
      { id: "window", name: "窗口", bg: "night", padding: 80, inset: 8, radius: 14, shadow: 44, opacity: 36, ratio: "auto", chrome: true, noise: false },
      { id: "gallery", name: "展陈", bg: "slate", padding: 64, inset: 12, radius: 10, shadow: 20, opacity: 14, ratio: "auto", chrome: false, noise: false }
    ];

    const state = {
      image: null,
      bgImage: null,
      bg: "haze",
      solid: "#D7C4B0",
      padding: 72,
      inset: 0,
      radius: 16,
      shadow: 40,
      opacity: 26,
      bgBlur: 0,
      ratio: "auto",
      chrome: false,
      noise: true,
      scale: 2,
      anchorX: 0.5,
      anchorY: 0.5
    };
    let savedLooks = [];
    let activeLookId = "clean";
    let defaultLook = null;
    const backgroundImages = new Map();
    const blurBuf = document.createElement("canvas");

    const $ = (id) => document.getElementById(id);
    const preview = $("preview");
    const pctx = preview.getContext("2d");
    const noiseTile = makeNoiseTile();

    function makeNoiseTile() {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const x = c.getContext("2d");
      const data = x.createImageData(128, 128);
      for (let i = 0; i < data.data.length; i += 4) {
        const n = 180 + Math.random() * 75;
        data.data[i] = n;
        data.data[i + 1] = n;
        data.data[i + 2] = n;
        data.data[i + 3] = 36;
      }
      x.putImageData(data, 0, 0);
      return c;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function lookPayload() {
      return {
        bg: state.bg, solid: state.solid, padding: state.padding, inset: state.inset,
        radius: state.radius, shadow: state.shadow, opacity: state.opacity,
        bgBlur: state.bgBlur, ratio: state.ratio, chrome: state.chrome,
        noise: state.noise, scale: state.scale
      };
    }

    function persist() {
      try {
        const payload = lookPayload();
        localStorage.setItem("softshot-v3", JSON.stringify({
          ...payload, anchorX: state.anchorX, anchorY: state.anchorY
        }));
        localStorage.setItem("softshot-looks-v1", JSON.stringify(savedLooks));
        localStorage.setItem("softshot-default-v1", JSON.stringify(defaultLook));
      } catch {}
    }

    function restore() {
      try {
        const raw = localStorage.getItem("softshot-v3") || localStorage.getItem("softshot-v2");
        if (raw) Object.assign(state, JSON.parse(raw));
        const looks = localStorage.getItem("softshot-looks-v1");
        if (looks) savedLooks = JSON.parse(looks) || [];
        const def = localStorage.getItem("softshot-default-v1");
        if (def) defaultLook = JSON.parse(def);
      } catch {}
      if (typeof state.inset !== "number") state.inset = 0;
      if (typeof state.bgBlur !== "number") state.bgBlur = 0;
      if (typeof state.anchorX !== "number") state.anchorX = 0.5;
      if (typeof state.anchorY !== "number") state.anchorY = 0.5;
      state.image = null;
      state.bgImage = null;
      if (state.bg === "photo") state.bg = "haze";
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rad = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad);
      else {
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }
    }

    function drawChecker(ctx, w, h, size = 12) {
      const a = "#F3EBE1", b = "#E6DCCF";
      for (let y = 0; y < h; y += size) {
        for (let x = 0; x < w; x += size) {
          ctx.fillStyle = ((x / size + y / size) | 0) % 2 ? a : b;
          ctx.fillRect(x, y, size, size);
        }
      }
    }

    function currentPreset() {
      return PRESETS.find((p) => p.id === state.bg) || PRESETS[0];
    }

    function hexRgb(hex) {
      const h = hex.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    function paintLinear(ctx, w, h, colors, angle) {
      const rad = ((angle || 135) * Math.PI) / 180;
      const len = Math.hypot(w, h) / 2;
      const g = ctx.createLinearGradient(
        w / 2 - Math.cos(rad) * len, h / 2 - Math.sin(rad) * len,
        w / 2 + Math.cos(rad) * len, h / 2 + Math.sin(rad) * len
      );
      colors.forEach((c, i) => g.addColorStop(i / Math.max(1, colors.length - 1), c));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    function paintRadial(ctx, w, h, inner, outer) {
      const g = ctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.52, Math.hypot(w, h) * 0.64);
      g.addColorStop(0, inner);
      g.addColorStop(1, outer);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    function paintMesh(ctx, w, h, base, orbs) {
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      orbs.forEach((o) => {
        const [r, g, b] = hexRgb(o.color);
        const rad = Math.max(w, h) * (o.s || 0.55);
        const gr = ctx.createRadialGradient(w * o.x, h * o.y, 0, w * o.x, h * o.y, rad);
        gr.addColorStop(0, `rgba(${r},${g},${b},${o.a ?? 0.7})`);
        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, w, h);
      });
    }

    function coverDest(w, h, iw, ih) {
      const scale = Math.max(w / iw, h / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      return { dx: (w - dw) / 2, dy: (h - dh) / 2, dw, dh };
    }

    function paintCover(ctx, w, h, img, blur) {
      if (!img) return false;
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if (!iw || !ih) return false;
      const { dx, dy, dw, dh } = coverDest(w, h, iw, ih);
      if (blur > 0) {
        const maxSide = 560;
        const ratio = Math.min(1, maxSide / Math.max(w, h));
        const bw = Math.max(2, Math.round(w * ratio));
        const bh = Math.max(2, Math.round(h * ratio));
        blurBuf.width = bw;
        blurBuf.height = bh;
        const bx = blurBuf.getContext("2d");
        bx.clearRect(0, 0, bw, bh);
        try {
          bx.filter = `blur(${Math.max(2, blur * ratio * 0.85)}px)`;
          bx.drawImage(img, dx * ratio, dy * ratio, dw * ratio, dh * ratio);
          bx.filter = "none";
        } catch (err) {
          bx.filter = "none";
          bx.drawImage(img, dx * ratio, dy * ratio, dw * ratio, dh * ratio);
        }
        ctx.drawImage(blurBuf, 0, 0, w, h);
      } else {
        ctx.drawImage(img, dx, dy, dw, dh);
      }
      return true;
    }

    function paintBackground(ctx, w, h) {
      const preset = currentPreset();
      if (preset.type === "clear") {
        drawChecker(ctx, w, h);
        return;
      }
      if (preset.type === "frost") {
        ctx.fillStyle = "#D9CBB8";
        ctx.fillRect(0, 0, w, h);
        paintCover(ctx, w, h, state.image, state.bgBlur || 40);
        ctx.fillStyle = "rgba(28, 22, 16, 0.16)";
        ctx.fillRect(0, 0, w, h);
      } else if (preset.type === "photo" || preset.type === "builtin-image") {
        ctx.fillStyle = "#D9CBB8";
        ctx.fillRect(0, 0, w, h);
        const bgImage = preset.type === "photo" ? state.bgImage : backgroundImages.get(preset.id);
        if (!paintCover(ctx, w, h, bgImage, state.bgBlur)) {
          paintMesh(ctx, w, h, PRESETS[0].base, PRESETS[0].orbs);
        } else if (state.bgBlur > 0) {
          ctx.fillStyle = "rgba(28, 22, 16, 0.10)";
          ctx.fillRect(0, 0, w, h);
        }
      } else if (preset.type === "solid") {
        ctx.fillStyle = state.solid;
        ctx.fillRect(0, 0, w, h);
      } else if (preset.type === "mesh") {
        paintMesh(ctx, w, h, preset.base, preset.orbs);
      } else if (preset.type === "radial") {
        paintRadial(ctx, w, h, preset.colors[0], preset.colors[1]);
      } else {
        paintLinear(ctx, w, h, preset.colors, preset.angle);
      }
      if (state.noise && preset.type !== "clear") {
        ctx.save();
        ctx.globalCompositeOperation = "soft-light";
        const pat = ctx.createPattern(noiseTile, "repeat");
        ctx.globalAlpha = preset.type === "radial" ? 0.28 : (["frost", "photo", "builtin-image"].includes(preset.type) ? 0.22 : 0.42);
        ctx.fillStyle = pat;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
    }

    function swatchCss(p) {
      if (p.type === "clear" || p.type === "photo" || p.type === "frost") return "";
      if (p.type === "solid") return state.solid;
      if (p.type === "mesh") {
        const layers = p.orbs.map((o) =>
          `radial-gradient(circle at ${o.x * 100}% ${o.y * 100}%, ${o.color}, transparent 62%)`
        );
        return layers.join(", ") + ", " + p.base;
      }
      if (p.type === "radial") {
        return `radial-gradient(circle at 50% 42%, ${p.colors[0]}, ${p.colors[1]})`;
      }
      const angle = p.angle || 135;
      return `linear-gradient(${angle}deg, ${p.colors.join(", ")})`;
    }

    function drawChrome(ctx, x, y, w, h) {
      ctx.fillStyle = "#F3EEE7";
      ctx.fillRect(x, y, w, h);
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "rgba(255,255,255,0.55)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "rgba(44,38,30,0.08)";
      ctx.fillRect(x, y + h - 1, w, 1);
      const dots = ["#FF5F57", "#FEBC2E", "#28C840"];
      const r = Math.max(5, Math.round(h * 0.16));
      const gap = r * 2 + 6;
      dots.forEach((c, i) => {
        ctx.beginPath();
        ctx.fillStyle = c;
        ctx.arc(x + 16 + r + i * gap, y + h / 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.fillStyle = "rgba(0,0,0,0.12)";
        ctx.arc(x + 16 + r + i * gap, y + h / 2, r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0,0,0,0.12)";
        ctx.lineWidth = 0.6;
        ctx.stroke();
      });
    }

    function layout(imgW, imgH) {
      const chromeNat = state.chrome ? Math.max(36, Math.round(imgW * 0.028)) : 0;
      const natW = imgW;
      const natH = imgH + chromeNat;
      const pad = state.padding;
      const inset = Math.max(0, state.inset || 0);
      let canvasW = natW + pad * 2;
      let canvasH = natH + pad * 2;
      if (state.ratio !== "auto") {
        const [aw, ah] = state.ratio.split(":").map(Number);
        const target = aw / ah;
        if (canvasW / canvasH > target) canvasH = canvasW / target;
        else canvasW = canvasH * target;
      }
      const innerW = Math.max(48, canvasW - inset * 2);
      const innerH = Math.max(48, canvasH - inset * 2);
      const fit = Math.min(innerW / natW, innerH / natH, 1);
      const cardW = natW * fit;
      const cardH = natH * fit;
      const chromeH = chromeNat * fit;
      const slackX = Math.max(0, canvasW - cardW - inset * 2);
      const slackY = Math.max(0, canvasH - cardH - inset * 2);
      const ax = state.ratio === "auto" ? 0.5 : Math.min(1, Math.max(0, state.anchorX));
      const ay = state.ratio === "auto" ? 0.5 : Math.min(1, Math.max(0, state.anchorY));
      const x = inset + slackX * ax;
      const y = inset + slackY * ay;
      return { canvasW, canvasH, cardW, cardH, chromeH, x, y, slackX, slackY, inset };
    }

    function shadowRgb() {
      return currentPreset().type === "radial" ? "0, 0, 0" : "42, 28, 16";
    }

    function drawCardShadow(ctx, x, y, w, h, r) {
      const s = state.shadow;
      const a = state.opacity / 100;
      if (s <= 0 || a <= 0) return;
      const rgb = shadowRgb();
      ctx.save();
      ctx.shadowColor = `rgba(${rgb}, ${a * 0.20})`;
      ctx.shadowBlur = s * 1.55;
      ctx.shadowOffsetY = s * 0.30;
      ctx.shadowOffsetX = 0;
      ctx.fillStyle = `rgb(${rgb})`;
      roundRect(ctx, x, y, w, h, r);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.shadowColor = `rgba(${rgb}, ${Math.min(0.62, a * 0.92)})`;
      ctx.shadowBlur = Math.max(3, s * 0.14);
      ctx.shadowOffsetY = Math.max(1, s * 0.08);
      ctx.shadowOffsetX = 0;
      ctx.fillStyle = `rgb(${rgb})`;
      roundRect(ctx, x, y, w, h, r);
      ctx.fill();
      ctx.restore();
    }

    function renderTo(ctx, width, height, img, opts) {
      const L = layout(img.naturalWidth, img.naturalHeight);
      const { canvasW, canvasH, cardW, cardH, chromeH, x, y } = L;
      const sx = width / canvasW;
      const sy = height / canvasH;
      ctx.setTransform(sx, 0, 0, sy, 0, 0);
      ctx.clearRect(0, 0, canvasW, canvasH);
      if (!(opts && opts.transparent)) paintBackground(ctx, canvasW, canvasH);

      const r = state.radius * Math.min(cardW / img.naturalWidth, 1);
      drawCardShadow(ctx, x, y, cardW, cardH, r);

      ctx.save();
      roundRect(ctx, x, y, cardW, cardH, r);
      ctx.clip();
      if (state.chrome) drawChrome(ctx, x, y, cardW, chromeH);
      ctx.drawImage(img, x, y + chromeH, cardW, cardH - chromeH);
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "rgba(44,38,30,0.10)";
      ctx.lineWidth = 1;
      roundRect(ctx, x + 0.5, y + 0.5, cardW - 1, cardH - 1, r);
      ctx.stroke();
      ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function canNudge() {
      if (!state.image || state.ratio === "auto") return false;
      const L = layout(state.image.naturalWidth, state.image.naturalHeight);
      return L.slackX > 1 || L.slackY > 1;
    }

    function previewFit() {
      syncExportButtons();
      $("backgroundName").textContent = currentPreset().name;
      $("previewStatus").textContent = !state.image ? "等待导入图片"
        : $("btnSave").disabled ? "背景加载中" : "实时预览";
      $("exportInfo").textContent = state.image
        ? exportSize().join(" × ") + " px · PNG" : "准备好后，导出为 PNG";
      if (!state.image) return;
      const stage = $("stage");
      const style = getComputedStyle(stage);
      const maxW = Math.max(1, stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
      const maxH = Math.max(1, stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
      const { canvasW, canvasH } = layout(state.image.naturalWidth, state.image.naturalHeight);
      const fit = Math.min(maxW / canvasW, maxH / canvasH, 1);
      const cssW = Math.max(1, Math.round(canvasW * fit));
      const cssH = Math.max(1, Math.round(canvasH * fit));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      preview.style.width = cssW + "px";
      preview.style.height = cssH + "px";
      preview.width = Math.round(cssW * dpr);
      preview.height = Math.round(cssH * dpr);
      preview.classList.toggle("is-nudge", canNudge());
      renderTo(pctx, preview.width, preview.height, state.image);
    }

    function exportSize() {
      const img = state.image;
      const { canvasW, canvasH } = layout(img.naturalWidth, img.naturalHeight);
      const scale = state.scale;
      let w = Math.round(canvasW * scale);
      let h = Math.round(canvasH * scale);
      const cap = 8000;
      if (w > cap || h > cap) {
        const s = cap / Math.max(w, h);
        w = Math.round(w * s);
        h = Math.round(h * s);
      }
      return [w, h];
    }

    function exportCanvas() {
      const [w, h] = exportSize();
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      renderTo(ctx, w, h, state.image, { transparent: currentPreset().type === "clear" });
      return c;
    }

    function loadImage(src, name) {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.anchorX = 0.5;
        state.anchorY = 0.5;
        document.body.classList.add("has-image");
        $("btnCopy").disabled = false;
        $("btnSave").disabled = false;
        $("btnReset").disabled = false;
        previewFit();
      };
      img.onerror = () => toast("这张图读不出来");
      img.src = src;
    }

    function fromFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        toast("请放入图片文件");
        return;
      }
      const url = URL.createObjectURL(file);
      loadImage(url);
    }

    function loadBgImage(src) {
      const img = new Image();
      img.onload = () => {
        state.bgImage = img;
        state.bg = "photo";
        activeLookId = "";
        refreshPhotoSwatch();
        syncControls();
        persist();
        previewFit();
        toast("已套上背景图");
      };
      img.onerror = () => toast("背景图读不出来");
      img.src = src;
    }

    function fromBgFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        toast("请放入图片文件");
        return;
      }
      loadBgImage(URL.createObjectURL(file));
    }

    function setPressed(container, id) {
      [...container.children].forEach((el) => {
        el.setAttribute("aria-pressed", el.dataset.id === id ? "true" : "false");
      });
    }

    const SWATCH_ICONS = {
      photo: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 14.5l2.3-2.6a1 1 0 011.4 0L15 15l1.1-1.2a1 1 0 011.5.1L20 16.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.6" cy="9.2" r="1.05" fill="currentColor"/></svg>',
      frost: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.2" stroke="currentColor" stroke-width="1.55" opacity=".38"/><circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.55"/><path d="M12 3.2v2.6M12 18.2v2.6M3.2 12h2.6M18.2 12h2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
    };

    function syncBgExtra() {
      const t = currentPreset().type;
      $("bgExtra").hidden = !["photo", "frost", "builtin-image"].includes(t);
      $("bgFileRow").hidden = t !== "photo";
      $("bgBlur").value = state.bgBlur;
      $("valBgBlur").textContent = state.bgBlur;
      $("btnBgPick").textContent = state.bgImage ? "更换图片" : "选择图片";
    }

    function refreshPhotoSwatch() {
      const el = [...$("swatches").children].find((x) => x.dataset.id === "photo");
      if (!el) return;
      if (state.bgImage && state.bgImage.src) {
        el.classList.add("has-thumb");
        el.style.backgroundImage = "url(" + state.bgImage.src + ")";
        el.innerHTML = "";
      } else {
        el.classList.remove("has-thumb");
        el.style.backgroundImage = "";
        el.innerHTML = SWATCH_ICONS.photo;
      }
    }

    function syncDefaultBtn() {
      const btn = $("btnDefault");
      if (!btn) return;
      if (defaultLook) {
        const same = payloadClose(defaultLook, lookPayload());
        btn.textContent = same
          ? "下次使用「" + (defaultLook.name || "当前搭配") + "」· 点击取消"
          : "改用当前搭配作为默认";
        btn.classList.add("boot-on");
      } else {
        btn.textContent = "下次打开使用当前搭配";
        btn.classList.remove("boot-on");
      }
    }

    function payloadClose(a, b) {
      if (!a || !b) return false;
      const keys = ["bg", "solid", "padding", "inset", "radius", "shadow", "opacity", "bgBlur", "ratio", "chrome", "noise", "scale"];
      return keys.every((k) => a[k] === b[k] || (a[k] == null && (b[k] == null || b[k] === 0)));
    }

    function setDefaultLook(look, name, source, id) {
      defaultLook = { source: source || "snapshot", id: id || "", name: name || "当前搭配", ...lookPayload() };
      persist();
      syncDefaultBtn();
      renderSavedLooks();
      toast("下次打开将使用「" + defaultLook.name + "」");
    }

    function syncControls() {
      $("padding").value = state.padding;
      $("valPadding").textContent = state.padding;
      $("inset").value = state.inset;
      $("valInset").textContent = state.inset;
      $("radius").value = state.radius;
      $("valRadius").textContent = state.radius;
      $("shadow").value = state.shadow;
      $("valShadow").textContent = state.shadow;
      $("opacity").value = state.opacity;
      $("valOpacity").textContent = state.opacity + "%";
      $("solidColor").value = state.solid;
      $("solidRow").hidden = currentPreset().type !== "solid";
      $("chrome").setAttribute("aria-pressed", state.chrome ? "true" : "false");
      $("noise").setAttribute("aria-pressed", state.noise ? "true" : "false");
      setPressed($("swatches"), state.bg);
      setPressed($("imageBackgrounds"), state.bg);
      setPressed($("ratios"), state.ratio);
      setPressed($("scales"), String(state.scale));
      setPressed($("looks"), activeLookId);
      $("backgroundName").textContent = currentPreset().name;
      const solidSwatch = [...$("swatches").children].find((x) => x.dataset.id === "solid");
      if (solidSwatch) solidSwatch.style.background = state.solid;
      syncBgExtra();
      refreshPhotoSwatch();
      syncDefaultBtn();
    }

    function applyLook(look, id) {
      activeLookId = id || look.id || "";
      let bg = look.bg;
      if (bg === "photo" && !state.bgImage) bg = "haze";
      state.bg = bg;
      if (look.solid) state.solid = look.solid;
      state.padding = look.padding;
      state.inset = typeof look.inset === "number" ? look.inset : 0;
      state.radius = look.radius;
      state.shadow = look.shadow;
      state.opacity = look.opacity;
      state.bgBlur = typeof look.bgBlur === "number" ? look.bgBlur : 0;
      state.ratio = look.ratio;
      state.chrome = !!look.chrome;
      state.noise = look.noise !== false;
      if (look.scale) state.scale = look.scale;
      if (bg === "frost" && state.bgBlur < 8) state.bgBlur = 40;
      state.anchorX = 0.5;
      state.anchorY = 0.5;
      syncControls();
      persist();
      previewFit();
    }

    function renderSavedLooks() {
      const box = $("savedLooks");
      box.innerHTML = "";
      savedLooks.forEach((look, i) => {
        const row = document.createElement("div");
        row.className = "saved-item";
        const star = document.createElement("button");
        star.className = "star" + (defaultLook && defaultLook.source === "user" && defaultLook.name === look.name ? " is-on" : "");
        star.title = "下次打开使用此搭配";
        star.setAttribute("aria-label", "设为默认搭配 " + look.name);
        star.textContent = star.classList.contains("is-on") ? "★" : "☆";
        star.addEventListener("click", () => {
          if (defaultLook && defaultLook.source === "user" && defaultLook.name === look.name) {
            defaultLook = null;
            persist();
            syncDefaultBtn();
            renderSavedLooks();
            toast("已取消默认搭配");
            return;
          }
          applyLook(look, "user-" + i);
          setDefaultLook(look, look.name, "user", "user-" + i);
        });
        const apply = document.createElement("button");
        apply.className = "apply";
        apply.textContent = look.name;
        apply.addEventListener("click", () => applyLook(look, "user-" + i));
        const del = document.createElement("button");
        del.className = "del";
        del.setAttribute("aria-label", "删除 " + look.name);
        del.textContent = "×";
        del.addEventListener("click", () => {
          if (defaultLook && defaultLook.source === "user" && defaultLook.name === look.name) defaultLook = null;
          savedLooks.splice(i, 1);
          persist();
          renderSavedLooks();
          syncDefaultBtn();
        });
        row.append(star, apply, del);
        box.appendChild(row);
      });
    }

    function chooseBg(p) {
      if (p.type === "photo" && !state.bgImage) {
        $("bgFile").click();
        return;
      }
      if (p.type === "frost" && state.bgBlur < 8) state.bgBlur = 40;
      state.bg = p.id;
      activeLookId = "";
      setPressed($("looks"), "");
      persist();
      syncControls();
      previewFit();
    }

    function syncExportButtons() {
      const preset = currentPreset();
      const ready = state.image && (preset.type !== "builtin-image" || backgroundImages.has(preset.id));
      $("btnCopy").disabled = !ready;
      $("btnSave").disabled = !ready;
    }

    function buildImageBackgrounds() {
      SOFTSHOT_BACKGROUNDS.forEach((p) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "image-background";
        button.dataset.id = p.id;
        button.setAttribute("aria-label", p.name);
        button.disabled = true;
        const img = new Image();
        img.alt = "";
        img.width = 1672;
        img.height = 941;
        const label = document.createElement("span");
        label.textContent = p.name;
        img.onload = () => {
          backgroundImages.set(p.id, img);
          button.disabled = false;
          if (state.bg === p.id) previewFit();
        };
        img.onerror = () => {
          label.textContent = p.name + " · 加载失败";
          if (state.bg === p.id) toast("背景图加载失败，请选择其他背景");
        };
        img.src = p.src;
        button.append(img, label);
        button.addEventListener("click", () => chooseBg(PRESETS.find((preset) => preset.id === p.id)));
        $("imageBackgrounds").appendChild(button);
      });
    }

    function buildUI() {
      buildImageBackgrounds();
      const sw = $("swatches");
      PRESETS.filter((p) => p.type !== "builtin-image").forEach((p) => {
        const b = document.createElement("button");
        b.className = "swatch" + (p.type === "clear" ? " is-clear" : "") + (p.type === "photo" || p.type === "frost" ? " is-special" : "");
        b.dataset.id = p.id;
        b.title = p.name;
        b.setAttribute("aria-label", p.name);
        if (p.type === "photo") b.innerHTML = SWATCH_ICONS.photo;
        else if (p.type === "frost") b.innerHTML = SWATCH_ICONS.frost;
        else if (p.type !== "clear") b.style.background = swatchCss(p);
        b.addEventListener("click", () => chooseBg(p));
        sw.appendChild(b);
      });

      const looks = $("looks");
      LOOKS.forEach((look) => {
        const b = document.createElement("button");
        b.className = "pill";
        b.dataset.id = look.id;
        b.textContent = look.name;
        b.addEventListener("click", () => applyLook(look, look.id));
        looks.appendChild(b);
      });

      $("btnSaveLook").addEventListener("click", () => {
        const name = ($("lookName").value || "").trim();
        if (!name) { toast("先给这组搭配起个名字"); $("lookName").focus(); return; }
        if (savedLooks.length >= 12) { toast("最多保存 12 组"); return; }
        savedLooks.push({ name, ...lookPayload() });
        $("lookName").value = "";
        persist();
        renderSavedLooks();
        toast("已保存「" + name + "」");
      });
      $("lookName").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("btnSaveLook").click();
      });
      $("btnDefault").addEventListener("click", () => {
        if (defaultLook && payloadClose(defaultLook, lookPayload())) {
          defaultLook = null;
          persist();
          syncDefaultBtn();
          renderSavedLooks();
          toast("已取消默认搭配");
          return;
        }
        const built = LOOKS.find((l) => l.id === activeLookId);
        const user = activeLookId.startsWith("user-") ? savedLooks[Number(activeLookId.slice(5))] : null;
        const name = built ? built.name : (user ? user.name : "当前搭配");
        const source = built ? "builtin" : (user ? "user" : "snapshot");
        const id = built ? built.id : (user ? activeLookId : "");
        setDefaultLook(null, name, source, id);
      });
      renderSavedLooks();

      const ratios = $("ratios");
      RATIOS.forEach((r) => {
        const b = document.createElement("button");
        b.className = "pill";
        b.dataset.id = r.id;
        b.textContent = r.label;
        b.addEventListener("click", () => {
          state.ratio = r.id;
          if (r.id === "auto") { state.anchorX = 0.5; state.anchorY = 0.5; }
          setPressed(ratios, r.id);
          persist(); previewFit();
        });
        ratios.appendChild(b);
      });
      setPressed(ratios, state.ratio);

      const scales = $("scales");
      [1, 2].forEach((n) => {
        const b = document.createElement("button");
        b.className = "pill";
        b.dataset.id = String(n);
        b.textContent = n + "×";
        b.addEventListener("click", () => {
          state.scale = n;
          setPressed(scales, String(n));
          persist();
          previewFit();
        });
        scales.appendChild(b);
      });
      setPressed(scales, String(state.scale));

      const bind = (id, key, label, fmt) => {
        const el = $(id);
        el.value = state[key];
        $(label).textContent = fmt(state[key]);
        el.addEventListener("input", () => {
          state[key] = Number(el.value);
          $(label).textContent = fmt(state[key]);
          activeLookId = "";
          setPressed($("looks"), "");
          persist(); previewFit();
          syncDefaultBtn();
        });
      };
      bind("padding", "padding", "valPadding", (v) => v);
      bind("inset", "inset", "valInset", (v) => v);
      bind("radius", "radius", "valRadius", (v) => v);
      bind("shadow", "shadow", "valShadow", (v) => v);
      bind("opacity", "opacity", "valOpacity", (v) => v + "%");
      bind("bgBlur", "bgBlur", "valBgBlur", (v) => v);

      $("solidColor").value = state.solid;
      $("solidColor").addEventListener("input", (e) => {
        state.solid = e.target.value;
        const solidSwatch = [...$("swatches").children].find((x) => x.dataset.id === "solid");
        if (solidSwatch) solidSwatch.style.background = state.solid;
        persist(); previewFit();
      });

      const hookSwitch = (id, key) => {
        const el = $(id);
        el.setAttribute("aria-pressed", state[key] ? "true" : "false");
        el.addEventListener("click", () => {
          state[key] = !state[key];
          el.setAttribute("aria-pressed", state[key] ? "true" : "false");
          activeLookId = "";
          setPressed($("looks"), "");
          persist(); previewFit();
        });
      };
      hookSwitch("chrome", "chrome");
      hookSwitch("noise", "noise");
      syncControls();
    }

    $("btnPick").addEventListener("click", () => $("file").click());
    $("file").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) fromFile(f);
      e.target.value = "";
    });
    $("btnBgPick").addEventListener("click", () => $("bgFile").click());
    $("bgFile").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) fromBgFile(f);
      e.target.value = "";
    });

    $("btnReset").addEventListener("click", () => {
      state.image = null;
      document.body.classList.remove("has-image");
      $("btnCopy").disabled = true;
      $("btnSave").disabled = true;
      $("btnReset").disabled = true;
      previewFit();
    });

    $("btnSave").addEventListener("click", () => {
      if (!state.image) return;
      const c = exportCanvas();
      const preset = currentPreset();
      const mime = preset.type === "clear" ? "image/png" : "image/png";
      c.toBlob((blob) => {
        const a = document.createElement("a");
        const t = new Date();
        const stamp = t.toISOString().slice(0, 19).replace(/[-:T]/g, "");
        a.href = URL.createObjectURL(blob);
        a.download = `softshot-${stamp}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        toast("已下载");
      }, mime);
    });

    $("btnCopy").addEventListener("click", async () => {
      if (!state.image) return;
      const c = exportCanvas();
      try {
        const blob = await new Promise((res) => c.toBlob(res, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        toast("已复制到剪贴板");
      } catch (err) {
        toast("复制失败，请改用下载。file:// 下部分浏览器会限制剪贴板");
      }
    });

    const wrap = $("stageWrap");
    ["dragenter", "dragover"].forEach((ev) => {
      wrap.addEventListener(ev, (e) => {
        e.preventDefault();
        wrap.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach((ev) => {
      wrap.addEventListener(ev, (e) => {
        e.preventDefault();
        wrap.classList.remove("dragover");
      });
    });
    wrap.addEventListener("drop", (e) => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) fromFile(f);
    });

    document.addEventListener("paste", (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith("image/")) {
          e.preventDefault();
          fromFile(item.getAsFile());
          return;
        }
      }
    });

    function typingInField(e) {
      const el = e.target;
      if (!el) return false;
      const tag = (el.tagName || "").toLowerCase();
      return tag === "input" || tag === "textarea" || el.isContentEditable;
    }

    document.addEventListener("keydown", (e) => {
      const mod = e.ctrlKey || e.metaKey;
      const k = e.key.toLowerCase();
      if (mod && k === "s") {
        if (state.image) { e.preventDefault(); $("btnSave").click(); }
        return;
      }
      if (typingInField(e)) return;
      if (mod && k === "c") {
        if (state.image) { e.preventDefault(); $("btnCopy").click(); }
        return;
      }
      if (e.key === "Delete" && state.image) {
        e.preventDefault();
        $("btnReset").click();
      }
    });

    let drag = null;
    preview.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || !state.image || !canNudge()) return;
      const L = layout(state.image.naturalWidth, state.image.naturalHeight);
      const rect = preview.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const lx = (e.clientX - rect.left) * (L.canvasW / rect.width);
      const ly = (e.clientY - rect.top) * (L.canvasH / rect.height);
      if (lx < L.x || ly < L.y || lx > L.x + L.cardW || ly > L.y + L.cardH) return;
      e.preventDefault();
      drag = {
        id: e.pointerId,
        x0: e.clientX,
        y0: e.clientY,
        ax: state.anchorX,
        ay: state.anchorY,
        slackX: L.slackX,
        slackY: L.slackY,
        scaleX: L.canvasW / rect.width,
        scaleY: L.canvasH / rect.height
      };
      preview.setPointerCapture(e.pointerId);
    });
    preview.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = (e.clientX - drag.x0) * drag.scaleX;
      const dy = (e.clientY - drag.y0) * drag.scaleY;
      if (drag.slackX > 1) state.anchorX = Math.min(1, Math.max(0, drag.ax + dx / drag.slackX));
      if (drag.slackY > 1) state.anchorY = Math.min(1, Math.max(0, drag.ay + dy / drag.slackY));
      previewFit();
    });
    const endDrag = (e) => {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      drag = null;
      persist();
    };
    preview.addEventListener("pointerup", endDrag);
    preview.addEventListener("pointercancel", endDrag);

    window.addEventListener("resize", () => previewFit());

    restore();
    const params = new URLSearchParams(location.search);
    if (params.get("bg") && PRESETS.some((p) => p.id === params.get("bg"))) state.bg = params.get("bg");
    if (params.get("chrome") === "1") state.chrome = true;
    if (params.get("ratio") && RATIOS.some((r) => r.id === params.get("ratio"))) state.ratio = params.get("ratio");

    activeLookId = LOOKS.find((look) => Object.entries(look).every(([key, value]) =>
      key === "id" || key === "name" || state[key] === value
    ))?.id || "";
    buildUI();
    const builtLook = LOOKS.find((l) => l.id === params.get("look"));
    if (builtLook) applyLook(builtLook, builtLook.id);
    else if (defaultLook && !params.get("bg") && !params.get("ratio") && !params.get("chrome")) {
      if (defaultLook.source === "builtin") {
        const L = LOOKS.find((l) => l.id === defaultLook.id);
        if (L) applyLook(L, L.id);
        else applyLook(defaultLook, "");
      } else if (defaultLook.source === "user") {
        const idx = savedLooks.findIndex((l) => l.name === defaultLook.name);
        if (idx >= 0) applyLook(savedLooks[idx], "user-" + idx);
        else applyLook(defaultLook, "");
      } else {
        applyLook(defaultLook, "");
      }
    }
    window.softshot = { loadImage, fromFile, fromBgFile, previewFit, state, applyLook };

    const demo = params.get("demo");
    if (demo) loadImage(demo);
  </script>
</body>
</html>
